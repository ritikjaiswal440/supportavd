<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Support Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Extra styles for the dynamic product boxes */
        .product-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: left; }
        .product-box h4 { margin-bottom: 10px; color: #1e293b; font-size: 15px; }
        .section-title { font-size: 18px; font-weight: 600; color: #111827; margin: 25px 0 15px; text-align: left; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <main class="app-main">
            
            <div class="card" id="authView">
                <div class="logo">S</div>
                <h1>Secure Support Portal</h1>
                <p>Register service requests for approved devices through our secure support system.</p>
                
                <div class="input-group">
                    <label for="clientCode">Client Reference Code</label>
                    <input type="text" id="clientCode" placeholder="Enter your reference code" autocomplete="off">
                </div>

                <button class="btn btn-primary" id="authBtn" onclick="handleAuth()">Continue to Portal</button>
                <div class="error-text hidden" id="authError"></div>
                <div class="footer">Secure Enterprise Service Request System</div>
            </div>

            <div class="card hidden" id="formView">
                <h2>Service Request Form</h2>
                <div class="company-display" id="companyDisplay"></div>
                
                <div class="section-title">General Information</div>
                <div class="grid-2">
                    <div class="input-group">
                        <label>Requester Name *</label>
                        <input type="text" id="reqName" required>
                    </div>
                    <div class="input-group">
                        <label>Work Email *</label>
                        <input type="email" id="reqEmail" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="input-group">
                        <label>Location *</label>
                        <input type="text" id="reqLocation" required>
                    </div>
                    <div class="input-group">
                        <label>Room Name *</label>
                        <input type="text" id="reqRoom" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="input-group">
                        <label>Category *</label>
                        <select id="reqCategory" required style="width: 100%; padding: 14px 16px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 15px; outline: none;">
                            <option value="">Select...</option>
                            <option value="Hardware">Hardware</option>
                            <option value="Software">Software</option>
                            <option value="Networking">Networking</option>
                            <option value="General Maintenance">General Maintenance</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Type of Service *</label>
                        <select id="reqServiceType" required style="width: 100%; padding: 14px 16px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 15px; outline: none;">
                            <option value="">Select...</option>
                            <option value="Repair">Repair</option>
                            <option value="Replacement">Replacement</option>
                            <option value="Inspection">Inspection</option>
                            <option value="New Installation">New Installation</option>
                        </select>
                    </div>
                </div>

                <div class="section-title">Products</div>
                <div id="productContainer"></div>
                <button type="button" class="btn btn-secondary" id="addProdBtn" onclick="addProductUI()" style="margin-bottom: 20px;">+ Add Product (Max 5)</button>

                <div class="section-title">Attachments</div>
                <div class="input-group">
                    <label>Invoice / Document (Optional)</label>
                    <input type="file" id="reqInvoice" accept=".pdf,.jpg,.jpeg,.png">
                </div>

                <button class="btn btn-primary" id="submitBtn" onclick="submitForm()" style="margin-top: 10px;">Submit Request</button>
            </div>

            <div class="card hidden" id="successView" style="text-align: center;">
                <div class="logo" style="background: #10B981;">✓</div>
                <h2>Request Submitted</h2>
                <p>Your reference number is:</p>
                <div class="request-id-display" id="reqIdDisplay"></div>
                <button class="btn btn-secondary" style="margin-top:20px;" onclick="window.location.reload()">Submit Another Request</button>
            </div>

        </main>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
