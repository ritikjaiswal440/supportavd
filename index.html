<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Support Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <main class="app-main">
            
            <div class="card" id="authView">
                <div class="logo">S</div>
                <h1>Secure Support Portal</h1>
                <p>Register service requests for approved devices through our secure support system.</p>
                
                <div class="input-group">
                    <label for="clientCode">Client Reference Code</label>
                    <input type="text" id="clientCode" placeholder="Enter your reference code" autocomplete="off">
                </div>

                <button class="btn btn-primary" id="authBtn" onclick="handleAuth()">Continue to Portal</button>
                <div class="error-text hidden" id="authError"></div>
                <div class="footer">Secure Enterprise Service Request System</div>
            </div>

            <div class="card hidden" id="formView">
                <h2>Service Request Form</h2>
                <div class="company-display" id="companyDisplay"></div>
                
                <div class="grid-2">
                    <div class="input-group">
                        <label>Requester Name *</label>
                        <input type="text" id="reqName" required>
                    </div>
                    <div class="input-group">
                        <label>Work Email *</label>
                        <input type="email" id="reqEmail" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="input-group">
                        <label>Location *</label>
                        <input type="text" id="reqLocation" required>
                    </div>
                    <div class="input-group">
                        <label>Room Name *</label>
                        <input type="text" id="reqRoom" required>
                    </div>
                </div>

                <button class="btn btn-primary" id="submitBtn" onclick="submitForm()">Submit Request</button>
            </div>

            <div class="card hidden" id="successView" style="text-align: center;">
                <div class="logo" style="background: #10B981;">✓</div>
                <h2>Request Submitted</h2>
                <p>Your reference number is:</p>
                <div class="request-id-display" id="reqIdDisplay"></div>
                <button class="btn btn-secondary" style="margin-top:20px;" onclick="window.location.reload()">Submit Another Request</button>
            </div>

        </main>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
